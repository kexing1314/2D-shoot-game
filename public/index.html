<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>2D 射击小游戏</title>
<style>
  body { margin: 0; background: #1a1a2e; color: #eee; font-family: system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; height: 100vh; }
  #lobby { text-align: center; }
  #lobby input { padding: 8px; font-size: 16px; margin: 6px; width: 200px;
                 background: #16213e; color: #eee; border: 1px solid #444; border-radius: 4px; }
  #lobby button { padding: 8px 24px; font-size: 16px; margin: 6px; cursor: pointer;
                  background: #4a9eff; border: none; border-radius: 4px; color: #fff; }
  #msg { margin-top: 10px; color: #ff6b6b; min-height: 20px; }
  #game { display: none; }
  canvas { display: block; background: #16213e; }
</style>
</head>
<body>
  <div id="lobby">
    <h1>2D 射击小游戏</h1>
    <p>WASD 移动 · 方向键射击</p>
    <input id="name" placeholder="昵称" maxlength="12"><br>
    <button id="createBtn">创建房间</button><br>
    <input id="code" placeholder="房间码" maxlength="4">
    <button id="joinBtn">加入</button>
    <div id="msg"></div>
  </div>
  <div id="game"><canvas id="canvas" width="1280" height="720"></canvas></div>
  <script src="/shared.js"></script>
  <script src="/client.js"></script>
</body>
</html>
